[mgr]
ratio = [ 1, 3, 4 ]
sort_by = "natural"
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 4
max_width = 1200
max_height = 1600

[opener]
edit = [
    { run = 'nvim "$@"', block = true, for = "windows" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.{c,cc,cpp,cs,css,go,h,hpp,html,ini,java,js,json,jsx,lua,md,ps1,py,rs,sh,sql,toml,ts,tsx,xml,yaml,yml}", use = "edit" },
]
